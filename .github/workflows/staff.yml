name: Update staff assistant
on:
  push:
    branches: [main]
    paths: ['staff-source/**', '.github/workflows/staff.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: staff-assistant
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy Gemini Worker
        id: worker
        if: vars.HARAGO_AUTO_DEPLOY_WORKER == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: source/staff-source/서버
          command: deploy --var SHEETS_LOG_URL:${{ vars.SHEETS_LOG_URL }}
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Build and check manual and wine list
        working-directory: source/staff-source
        env:
          WORKER_URL: ${{ steps.worker.outputs.deployment-url }}
          HARAGO_AI_ENDPOINT: ${{ vars.HARAGO_AI_ENDPOINT }}
          HARAGO_QUESTION_LOG_ENABLED: ${{ vars.HARAGO_QUESTION_LOG_ENABLED }}
        run: |
          if [ -n "$WORKER_URL" ]; then export HARAGO_AI_ENDPOINT="${WORKER_URL%/}/api/chat"; fi
          npm run update
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Update staff page
        run: |
          mkdir -p site/staff site/wine
          cp source/staff-source/챗봇_시안.html site/staff/index.html
          cp source/staff-source/손님용/시안.html site/wine/index.html
          cd site
          git add staff/index.html wine/index.html
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update staff assistant from manual and wine list'
          git push origin gh-pages
      - name: Request Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/pages/builds" --method POST

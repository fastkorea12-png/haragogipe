:root{--wine:#8D241C;--wine-d:#6E1B15;--paper:#FBF9F5;--ink:#2B211B;--muted:#6B5F57;--rule:#E8E0D6;--soft:#F1EBE2;--bot:#fff;--ok:#2F6B3A;--warn:#8A5A00;--add:#2F6B3A;--del:#8D241C;--mod:#8A5A00;--mov:#2F5F8A}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.6 "Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif}
button,input,textarea{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer;min-height:44px}
input,textarea{scroll-margin-top:84px;scroll-margin-bottom:24px}#root{overflow-anchor:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8D241C55;outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--bot);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{height:36px;width:auto;display:block}.brand p{margin:0;color:var(--wine);border-left:1px solid var(--rule);padding-left:12px;font-weight:700}
.btn{border:1px solid var(--rule);background:var(--bot);border-radius:10px;padding:8px 14px}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff;font-weight:700}.btn.primary:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--wine);border-color:var(--wine)}
main{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1,h2,h3{margin:0}h2{font-size:20px;color:var(--wine);margin-bottom:8px}
.card{background:var(--bot);border:1px solid var(--rule);border-radius:14px;padding:16px;margin-bottom:12px}
label.f{display:block;font-weight:700;margin:12px 0 4px}
input[type=text],input[type=password],textarea{width:100%;border:1px solid #CFC4B8;border-radius:10px;padding:10px 12px;background:#fff;font-size:16px;line-height:1.5}
textarea{resize:none;overflow:hidden;display:block}
.hint{color:var(--muted);margin:6px 0}
.msg{border-radius:12px;padding:12px 14px;margin:0 0 12px;border:1px solid var(--rule);background:var(--soft)}
.msg.ok{border-color:var(--ok);color:var(--ok);background:#EEF6EF}.msg.err{border-color:var(--wine);color:var(--wine);background:#FBEDEB}.msg.warn{border-color:var(--warn);color:var(--warn);background:#FBF3E2}
.msg ul{margin:6px 0 0;padding-left:20px}
.tabs,.kinds{display:flex;gap:8px;margin:0 0 12px}.tabs button,.kinds button{flex:1;border:1px solid var(--rule);background:var(--bot);border-radius:10px;font-weight:700}
.tabs button[aria-pressed=true],.kinds button[aria-pressed=true]{background:var(--wine);color:#fff;border-color:var(--wine)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}.bar .count{font-weight:700;color:var(--wine)}.bar .sp{flex:1}
.sec{margin:20px 0 6px}.sec h3{font-size:16px;color:var(--wine)}
.sec-head{display:grid;gap:6px;margin-bottom:8px}.sec-head .tag{display:inline-block}
.row{background:var(--bot);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.row.added{border-left-color:var(--add)}.row.edited{border-left-color:var(--mod)}.row.moved{border-left-color:var(--mov)}.row.del{border-left-color:var(--del);background:#FBF3F1}
.row.del textarea{text-decoration:line-through;color:var(--muted);background:transparent}
.row.err{border-color:var(--wine);border-left-color:var(--wine)}
.rbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}.rbar .sp{flex:1}
.rbar button{min-width:44px;padding:6px 10px}
.badge{display:inline-block;border-radius:8px;padding:0 8px;font-weight:700;border:1px solid currentColor;line-height:1.5}
.badge.add{color:var(--add)}.badge.mod{color:var(--mod)}.badge.del{color:var(--del)}.badge.mov{color:var(--mov)}
.tag{display:inline-block;border-radius:8px;padding:0 8px;background:var(--soft);color:var(--muted);line-height:1.5}
.ropts{margin-top:8px;padding:10px;background:var(--soft);border-radius:10px;display:grid;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{min-width:44px;border:1px solid #CFC4B8;background:#fff;border-radius:10px;padding:6px 10px}.chips button[aria-pressed=true]{background:var(--wine);color:#fff;border-color:var(--wine)}
.rerr{color:var(--wine);font-weight:700;margin-top:6px}
.add-row{margin:4px 0 8px}
dialog{border:1px solid var(--rule);border-radius:16px;padding:20px;width:min(560px,calc(100vw - 24px));max-height:88dvh;overflow:auto;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:#2b211b66}
dialog ul{padding-left:20px;margin:6px 0}dialog li{margin:4px 0;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ver{display:grid;gap:4px}.ver .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ver .top b{color:var(--wine)}
.small{color:var(--muted)}
.chg{margin:8px 0 2px;font-weight:700}
.cmp{color:var(--muted)}
.pv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.pv-full{grid-column:1/-1}.pv-h{margin:14px 0 4px!important;padding-bottom:4px;border-bottom:1px solid var(--rule);color:var(--wine);font-size:16px}
.pv-item{display:flex;gap:8px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--rule)}.pv-box{flex:none;width:20px;height:20px;border:2px solid #CFC4B8;border-radius:4px;margin-top:3px}.pv-text{overflow-wrap:anywhere;line-height:1.4}.pv-text .tag{margin-left:6px}
.sub-card{display:block;width:100%;text-align:left;margin-bottom:8px}.sub-card.bad{border-color:var(--wine);border-left:4px solid var(--wine)}.row.sub-missing{border-left-color:var(--wine);background:#FBF3F1}.row.sub-done{border-left-color:var(--add)}
@media(max-width:340px){.pv-grid{grid-template-columns:1fr}}
.tabs.top{position:relative;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}.tabs.top button{flex:1 0 auto;padding:0 12px;white-space:nowrap}.tabs.sub button{font-weight:600}
.nbadge{display:inline-block;min-width:22px;padding:0 6px;margin-left:4px;border-radius:11px;background:var(--wine);color:#fff;line-height:22px;font-weight:700;text-align:center}.tabs button[aria-pressed=true] .nbadge{background:#fff;color:var(--wine)}
.crow{padding:6px 10px}.rowopen{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 0;min-height:52px}.rname{display:block}.rsum{display:block;color:var(--muted);overflow-wrap:anywhere}
.row.pre,textarea.pre{box-shadow:0 0 0 3px #E0B84A99;background:#FFF9E6}
textarea.bad{border-color:var(--wine)}
.fld{margin-bottom:6px}.fld label.f{margin-top:14px}
.lrow{display:flex;gap:8px;margin:6px 0}.lno{flex:none;width:24px;padding-top:10px;color:var(--muted);text-align:right;font-weight:700}.lbody{flex:1;min-width:0}.lbody .chips{margin-bottom:6px;align-items:center}
.acts.tight{margin-top:8px}
.tog[aria-pressed=true]{background:var(--wine);color:#fff;border-color:var(--wine)}
.pimg{display:block;width:100%;max-width:400px;height:auto;max-height:300px;object-fit:contain;border-radius:10px;border:1px solid var(--rule);background:var(--soft)}
.tag.apply{background:#FBF3E2;color:var(--warn)}
.prop .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.plabel{font-weight:700;margin:6px 0 4px;overflow-wrap:anywhere}.pcur,.pnew{overflow-wrap:anywhere;margin:4px 0}.pcur{color:var(--muted)}.badge.pk{color:var(--mov)}
.detail .bar{margin-top:0}
.cmp{margin:2px 0}
.badge.st-none{color:var(--del);background:#FBEDEB}.badge.st-low{color:var(--warn);background:#FBF3E2}.badge.st-ok{color:var(--ok);background:#EEF6EF}.badge.st-na{color:var(--muted);background:var(--soft)}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:6px 0}.qcell{background:var(--soft);border-radius:8px;padding:6px 8px;display:grid;gap:2px;align-content:start}
.row.inv{padding:10px 12px}
.osec{background:var(--bot);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin-bottom:12px}.osec h3{font-size:18px;color:var(--wine);overflow-wrap:anywhere}.osec.none h3{color:var(--warn)}
.orow{display:flex;gap:6px 10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding:8px 0}.orow .oname{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}.orow.off .oname b{text-decoration:line-through;color:var(--muted)}
.oqty{display:flex;align-items:center;gap:4px}.oqty button{min-width:44px;padding:0 8px}.oqty input[type=text]{width:64px;text-align:center}
.omsg{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0 0}
.plist{list-style:none;padding:0;margin:8px 0}.plist li{border-bottom:1px solid var(--rule);padding:6px 2px;overflow-wrap:anywhere}.plist li.bad{color:var(--wine)}
select{font:inherit;font-size:16px;min-height:44px;border:1px solid #CFC4B8;border-radius:10px;padding:0 8px;background:#fff;color:inherit;max-width:100%}
#invChips{flex-wrap:wrap}
.nrow{display:grid;gap:4px;background:var(--bot);border:1px solid var(--rule);border-left:4px solid var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:8px}.nrow.none{border-left-color:var(--wine)}.nsub{color:var(--muted);display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.tag[data-stale]{background:#FBF3E2;color:var(--warn)}
.sech{margin:16px 0 6px;font-weight:700;color:var(--muted)}
details.un{margin:16px 0 0;background:var(--bot);border:1px solid var(--rule);border-radius:12px;padding:8px 14px}details.un summary{min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--muted);cursor:pointer}details.un ul{margin:0 0 8px;padding-left:20px}details.un li{overflow-wrap:anywhere}
.badge.lv0{color:var(--muted);background:var(--soft)}.badge.lv1{color:var(--warn);background:#FBF3E2}.badge.lv2{color:var(--mov);background:#EAF1F8}.badge.lv3{color:var(--ok);background:#EEF6EF}
.trow{display:flex;gap:8px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bot);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:10px;padding:8px 12px;margin-bottom:8px}.trow.lv3{border-left-color:var(--ok)}.trow.lv2{border-left-color:var(--mov)}.trow.lv1{border-left-color:var(--warn)}.trow .tname{overflow-wrap:anywhere}.trow .tmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tsum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 0}.tsum div{background:var(--soft);border-radius:10px;padding:8px 10px}.tsum b{display:block;font-size:20px;color:var(--wine)}
.rlog{list-style:none;padding:0;margin:0}.rlog li{border-bottom:1px solid var(--rule);padding:8px 2px;overflow-wrap:anywhere}
[hidden]{display:none!important}
@media(min-width:900px){main{max-width:880px}.row{padding:10px 14px}}

var EMBEDDED_CONTENT={"recipes":{"appetizers":[{"id":"a30a225e7","name":"1. 올리브 8pc","price":"8,000원","utensil":"티포크 인원 수만큼, \"씨앗 주의\" 안내","ingredients":["작은 접시","종지"],"steps":["올리브 8개를 찬물에 가볍게 씻어 짠맛을 뺀다.","작은 접시 가운데 종지를 놓고 올리브를 둥글게 두른다.","종지에는 견과류를 채운다.","올리브 위에 브라운 치즈를 소복이 갈아 올린다."],"garnish":"아몬드 슬라이스를 부숴 뿌리고 파슬리로 마무리."},{"id":"a91005a82","name":"2. 아이스크림","price":"8,000원","utensil":"티스푼을 인원 수만큼 위에 꽂아 서빙(너무 많으면 냅킨에 감싸서)","ingredients":["그릇","앞접시"],"steps":["아이스크림 3덩이를 그릇에 담는다.","빈 곳에 견과류를 채운다.","비스킷을 반으로 쪼개 뒤쪽에 꽂는다.","초코시럽(벌집 모양) 또는 트러플 오일과 후추를 뿌린다.","흰 작은 앞접시에 받쳐 서빙."]},{"id":"a754934a8","name":"3. 생초콜릿","price":"8,000원","utensil":"티포크 인원 수만큼","ingredients":["작은 접시"],"steps":["초콜릿 8개를 반으로 자른다.","작은 접시(브리 치즈용) 절반에 초콜릿을 놓는다.","남은 자리의 반에 견과류를 놓는다.","나머지 반에는 샤인머스켓 3알을 반으로 잘라 놓고 크림치즈를 올린다."]},{"id":"a26db7f07","name":"4. 하몽 덮은 모짜","price":"16,000원","utensil":"티포크 인원 수만큼","ingredients":["머그컵","밧드","샐러드톱","그릇"],"steps":["보코치니 18개를 머그컵에 담아 뜨거운 물로 2분 해동하고 찬물로 바꿔 마저 해동한다.","네모난 밧드에 방울토마토(큰 것 6개는 8등분, 작은 것 7~8개는 4등분)와 올리브 4개를 넣어 씻고 손질한다.","보코치니와 함께 소금 조금, 바질 페스토 1스푼, 메이플 시럽 두 바퀴 반, 샐러드톱 한 줌(베리류 빼기), 올리브유 2스푼, 오레가노 두 번을 넣고 골고루 섞는다.","하몽 한 장을 손으로 찢어 덮는다.","그라나 파다노를 소복이 갈고 그릇 둘레에 발사믹을 두 바퀴 두른다."],"garnish":"파슬리와 아몬드 슬라이스로 마무리."},{"id":"ac5603a4e","name":"5. 브리 치즈 구이","price":"15,000원","utensil":"포크 인원 수만큼 + 나이프 1개, 메이플 시럽 꼭 가져가기","ingredients":["밧드","전자레인지","토치","작은 접시","작은 잔"],"steps":["브리 치즈를 8등분해 밧드에 올리고 전자레인지 3분 돌린다.","토치로 겉을 살짝 그을린다.","작은 접시에 치즈를 올리고 비스킷 4개를 반으로 쪼개 8조각을 위쪽에 놓는다(치즈 조각 수와 같게).","작은 잔에 메이플 시럽을 반쯤 담고 아몬드 슬라이스를 살짝 뿌려 함께 낸다."],"garnish":"기본 마무리(아래 빈 곳 견과류, 치즈 위 아몬드 슬라이스, 비스킷 쪽 파슬리)로 마무리."},{"id":"aeba52a4d","name":"6. 그릴드 소세지","price":"15,000원","utensil":"큰 포크 인원 수만큼 + 나이프","ingredients":["밧드","전자레인지","흰 접시","토치","종지"],"steps":["밧드에 소시지 4개를 담아 전자레인지 2분 30초 돌린다(덜 데워졌으면 30초~1분 추가).","그동안 흰 접시에 로메인, 방울토마토 1개 4등분, 발사믹, 그라나 파다노 조금, 아몬드 슬라이스로 샐러드를 깐다.","소시지를 토치로 굽는다.","종지에 머스터드와 케첩을 반반 담고 파슬리를 살짝 뿌린다."],"garnish":"소시지를 올리고 파슬리를 뿌려 마무리."},{"id":"abe4f8a8a","name":"7. function h(tag,attrs){
  var e=document.createElement(tag),a=attrs||{};
  Object.keys(a).forEach(function(k){
    if(k==="class")e.className=a[k];else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),a[k]);
    else if(k==="text")e.textContent=a[k];else if(a[k]===true)e.setAttribute(k,"");else if(a[k]!==false&&a[k]!=null)e.setAttribute(k,a[k]);
  });
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;if(Array.isArray(c))c.forEach(function(x){if(x)e.append(x);});else e.append(c);}
  return e;
}

function fromData(cl){
  var out={};
  ["open","close"].forEach(function(k){
    var src=(cl&&cl[k])||{sections:[]};
    out[k]={intro:src.intro||"",sections:(src.sections||[]).map(function(s){
      return {title:s.title||"",note:s.note||"",isNew:false,items:(s.items||[]).map(function(it){return {id:it.id,text:it.text,days:(it.days||[]).slice(),biweekly:!!it.biweekly,confirm:!!it.confirm,del:false};})};
    })};
  });
  return out;

function slotsOf(kind,it){
  var out=[];
  if(kind==="recipes"){
    ["name","price","utensil","glass","garnish","note","confirmNote"].forEach(function(k){if(typeof it[k]==="string")out.push({key:k,path:k,get:function(){return it[k];},set:function(v){it[k]=v;}});});
    ["ingredients","steps"].forEach(function(k){(it[k]||[]).forEach(function(t,i){out.push({key:k+"."+i,path:k+"."+i,get:function(){return it[k][i];},set:function(v){it[k][i]=v;}});});});
  }else{
    ["situation","note","confirmNote"].forEach(function(k){if(typeof it[k]==="string")out.push({key:k,path:k,get:function(){return it[k];},set:function(v){it[k]=v;}});});
    (it.lines||[]).forEach(function(l,i){out.push({key:"lines."+i,path:"lines."+i,get:function(){return l.text;},set:function(v){l.text=v;}});});

// 삭제 제안이 항목 전체가 아니라 한 필드(입력칸)를 가리키면 그 필드만 비운다. 필드 지정은 대상 이름(항목 · 필드)이나 현재 문구가 입력칸과 맞는 경우.
// 반환: null(항목 통삭제) 또는 {ok,name,run} / {ok:false,msg}. 필수 필드(이름·상황)와 마지막 멘트 줄은 비우지 않고 경고만 한다.
function fieldDelete(kind,it,p){
  var segs=String(p.targetLabel||"").split(" · "),labeled=segs.length>=3,want=(p.current||"").trim(),slots=slotsOf(kind,it),hit=null;
  if(want)hit=slots.find(function(s){return String(s.get()||"").trim()===want;})||slots.find(function(s){return want.length>=4&&String(s.get()||"").indexOf(want)>=0;});
  var req=kind==="recipes"?"name":"situation";
  if(!labeled&&(!hit||hit.key===req))return null;
  var fname=labeled?segs.slice(2).join(" · "):"선택한 입력칸";
  if(!hit)return {ok:false,msg:"삭제할 입력칸(「"+fname+"」)을 현재 항목에서 찾지 못함. 항목은 삭제하지 않음. 수동 확인"};
  if(hit.key===req)return {ok:false,msg:"「"+fname+"」는 필수 항목이라 비울 수 없음. 항목은 삭제하지 않음. 항목 통삭제 제안이 아니면 반려"};
  var m=hit.key.match(/^(ingredients|steps|lines)\.(\d+)$/);
  if(m){
    var arr=it[m[1]],idx=Number(m[2]);
    if(m[1]==="lines"&&arr.length<=1)return {ok:false,msg:"마지막 멘트 줄은 비울 수 없음. 항목은 삭제하지 않음. 항목 통삭제 제안이 아니면 반려"};
    return {ok:true,name:fname,run:function(){arr.splice(idx,1);}};

}

:root{--wine:#8D241C;--wine-d:#6E1B15;--paper:#FBF9F5;--ink:#2B211B;--muted:#6B5F57;--rule:#E8E0D6;--soft:#F1EBE2;--bot:#fff;--ok:#2F6B3A;--okbg:#EEF6EF;--warn:#8A5A00;--warnbg:#FBF3E2;--errbg:#FBEDEB}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}html{overflow-anchor:none}
body{background:var(--paper);color:var(--ink);font:16px/1.6 "Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif}
button,input{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer;min-height:44px}
input,button,dialog{scroll-margin-top:72px;scroll-margin-bottom:120px}
button:focus-visible,input:focus-visible{outline:3px solid #8D241C55;outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--bot)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{height:36px;width:auto;display:block}.brand p{margin:0;color:var(--wine);border-left:1px solid var(--rule);padding-left:12px;font-weight:700;white-space:nowrap}
header a{font-size:16px;color:inherit;padding:10px 4px;white-space:nowrap}
main{max-width:560px;margin:0 auto;padding:16px 16px 140px}
h2{margin:0 0 8px;font-size:20px;color:var(--wine)}
.btn{border:1px solid var(--rule);background:var(--bot);border-radius:10px;padding:8px 14px}
.btn.primary{background:var(--wine);border-color:var(--wine);color:#fff;font-weight:700}.btn.primary:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--wine);border-color:var(--wine)}
input[type=date]{min-height:48px;border:1px solid #CFC4B8;border-radius:10px;padding:8px 12px;background:#fff;font-size:16px;line-height:1.5;max-width:100%}
input[type=text],input[type=search]{width:100%;min-height:48px;border:1px solid #CFC4B8;border-radius:10px;padding:10px 12px;background:#fff;font-size:16px;line-height:1.5}
label.f{display:block;font-weight:700;margin:14px 0 6px}
.hint{color:var(--muted);margin:6px 0}
.msg{border-radius:12px;padding:12px 14px;margin:0 0 12px;border:1px solid var(--rule);background:var(--soft)}
.msg.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg)}.msg.err{border-color:var(--wine);color:var(--wine);background:var(--errbg)}.msg.warn{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
.msg ul{margin:6px 0 0;padding-left:20px}
.chips{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 6px;margin:0 0 8px}
.chips button{flex:0 0 auto;white-space:nowrap;border:1px solid #CFC4B8;background:#fff;border-radius:22px;padding:0 16px;min-width:44px;font-weight:600}
.chips button[aria-pressed=true]{background:var(--wine);color:#fff;border-color:var(--wine)}
.seg{display:flex;gap:8px;margin:0 0 12px}.seg button{flex:1;border:1px solid #CFC4B8;background:#fff;border-radius:10px;font-weight:700}.seg button[aria-pressed=true]{background:var(--wine);color:#fff;border-color:var(--wine)}
.datebox{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:0 0 12px}.datebox .hint{margin:0}
.sech{margin:16px 0 4px;font-weight:700;color:var(--muted)}
.card{background:var(--bot);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;margin-bottom:12px}
#msg{min-height:56px}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--bot);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:10px;padding:8px 10px;min-height:64px}
.row.has{border-left-color:var(--ok)}.row.chg{border-left-color:var(--warn)}.row.bad{border-left-color:var(--wine);background:var(--errbg)}
.rname{font-weight:600;overflow-wrap:anywhere}.rno{display:inline-block;min-width:28px;color:var(--muted);font-weight:700}
.rsub{grid-column:1/2;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step{grid-column:2/3;grid-row:1/3;display:flex;align-items:center;gap:4px}
.step button{width:44px;padding:0;border:1px solid #CFC4B8;background:#fff;border-radius:10px;font-weight:700;font-size:20px}.step button:disabled{opacity:.4;cursor:default}
.step input{width:56px;min-height:44px;text-align:center;border:1px solid #CFC4B8;border-radius:10px;padding:0 4px;font-size:16px;background:#fff}
.badge{display:inline-block;border-radius:8px;padding:0 8px;font-weight:700;border:1px solid currentColor;line-height:1.5;white-space:nowrap}
.badge.s-none{color:var(--wine);background:var(--errbg)}.badge.s-low{color:var(--warn);background:var(--warnbg)}.badge.s-ok{color:var(--ok);background:var(--okbg)}.badge.s-na{color:var(--muted);background:var(--soft)}
.tag{display:inline-block;border-radius:8px;padding:0 8px;background:var(--warnbg);color:var(--warn);line-height:1.5}
.keep{color:var(--muted)}
.res{display:block;width:100%;text-align:left;background:var(--bot);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;margin-bottom:8px;min-height:64px}
.res .l1{display:block;font-weight:600;overflow-wrap:anywhere}.res .l2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted)}
#dBack{margin-top:12px}.loctab{width:100%;border-collapse:collapse;margin:8px 0}.loctab th,.loctab td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:top}.loctab th{color:var(--muted);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bot);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}.bar .sum{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.4}.bar .btn{min-width:96px;min-height:48px}
dialog{border:1px solid var(--rule);border-radius:16px;padding:20px;width:min(520px,calc(100vw - 24px));max-height:88dvh;overflow:auto;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:#2b211b66}
dialog ul{padding-left:20px;margin:6px 0}dialog li{margin:4px 0;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pending{border-color:var(--warn);background:var(--warnbg)}
.nrow{display:grid;gap:4px;background:var(--bot);border:1px solid var(--rule);border-left:4px solid var(--warn);border-radius:10px;padding:8px 12px}.nrow.none{border-left-color:var(--wine)}
.nsub{color:var(--muted);display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
details.un{margin:16px 0 0;background:var(--bot);border:1px solid var(--rule);border-radius:12px;padding:8px 14px}details.un summary{min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--muted);cursor:pointer}details.un ul{margin:0 0 8px;padding-left:20px}details.un li{overflow-wrap:anywhere}
.osec{background:var(--bot);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin-bottom:12px}.osec h3{font-size:18px;color:var(--wine);overflow-wrap:anywhere;margin:0 0 4px}.osec.none h3{color:var(--warn)}
.orow{display:flex;gap:6px 10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding:8px 0}.orow .oname{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}.orow .small{font-size:14px;color:var(--muted)}.orow.off .oname b{text-decoration:line-through;color:var(--muted)}
.oqty{display:flex;align-items:center;gap:4px}.oqty button{min-width:44px;min-height:44px;padding:0 8px}.oqty input[type=text]{width:56px;min-height:44px;text-align:center;padding:6px}
.omsg{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0 8px}
.alogin{display:flex;gap:8px;flex-wrap:wrap}.alogin input{flex:1 1 180px;min-height:48px;border:1px solid #CFC4B8;border-radius:10px;padding:10px 12px;font-size:16px}
#modes{margin-bottom:16px}#modes button{min-height:48px;font-size:17px}
.krow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;min-height:64px;background:var(--bot);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:10px;padding:8px 10px}
.krow.has{border-left-color:var(--ok)}.krow.chg{border-left-color:var(--warn)}
.krow .rname,.krow .rsub{grid-column:1}.kst{grid-column:2;grid-row:1/3;display:flex;gap:4px}.kst button{width:52px;border:1px solid #CFC4B8;background:#fff;border-radius:10px;font-weight:700;font-size:15px;padding:0}
@media (max-width:359px){.krow{grid-template-columns:1fr}.kst{grid-column:1;grid-row:auto}.kst button{flex:1;width:auto}}
.kst button[data-st=ok][aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}.kst button[data-st=low][aria-pressed=true]{background:var(--warn);border-color:var(--warn);color:#fff}.kst button[data-st=out][aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:#fff}
[hidden]{display:none!important}
</style></head><body>

  S.date=todayKST();applyDateUi();if(note)setDateNote(note);return true;
}
function applyDateUi(){
  ["surveyDate","kDate"].forEach(function(id){var el=$(id);if(!el)return;
    el.min=addDays(todayKST(),-MAX_PAST_DAYS);el.max=todayKST();if(el.value!==S.date)el.value=S.date;});
}
function uuid(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  var b=new Uint8Array(16);crypto.getRandomValues(b);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;
  var x=Array.prototype.map.call(b,function(v){return("0"+v.toString(16)).slice(-2);}).join("");
  return x.slice(0,8)+"-"+x.slice(8,12)+"-"+x.slice(12,16)+"-"+x.slice(16,20)+"-"+x.slice(20);
}

function group(id){for(var i=0;i<S.groups.length;i++)if(S.groups[i].id===id)return S.groups[i];return null;}
function findItem(id){for(var i=0;i<S.groups.length;i++)for(var j=0;j<S.groups[i].items.length;j++)if(S.groups[i].items[j].id===id)return S.groups[i].items[j];return null;}
function cnt(id,loc){var c=S.counts&&S.counts[id]&&S.counts[id][loc];return c?c:null;}
// 상태: 냉장고 수량 기준. 0 없음, 1~(기준-1) 필요, 기준 이상 충분
function statusOf(qty,min){
  if(qty==null)return {cls:"s-na",text:"- 미조사"};
  if(qty<=0)return {cls:"s-none",text:"✕ 없음"};
  if(qty<(min||DEFAULT_MIN))return {cls:"s-low",text:"▲ 필요"};
  return {cls:"s-ok",text:"● 충분"};
}
function badge(qty,min){var s=statusOf(qty,min);return h("span",{class:"badge "+s.cls,text:s.text});}
function staleTag(d){return isStale(d)?h("span",{class:"tag","data-stale":"1",text:"오래됨"}):null;}

// ---------- 숫자열 해석 ----------
function normDigits(s){return String(s).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).replace(/[，、﹐]/g,",").replace(/\s+/g,"");}
// 반환: {vals:[수|null...], errors:[], warns:[], count}
function parseDigits(raw,n){
  var s=normDigits(raw),out={vals:[],errors:[],warns:[],count:0};
  if(!s)return out;
  var bad=[];
  if(s.indexOf(",")>=0){
    var parts=s.split(",");if(parts.length>1&&parts[parts.length-1]==="")parts.pop();
    parts.forEach(function(p,i){
      if(p===""){out.vals.push(null);bad.push((i+1)+"번째 칸이 비어 있음");}
      else if(!/^\d+$/.test(p)){out.vals.push(null);bad.push((i+1)+"번째 \""+p.slice(0,6)+"\"는 숫자 아님");}
      else if(Number(p)>99){out.vals.push(null);bad.push((i+1)+"번째 "+p.slice(0,6)+"는 99 초과");}
      else out.vals.push(Number(p));
    });
  }else{
    for(var i=0;i<s.length;i++){
      var c=s.charAt(i);
      if(/\d/.test(c))out.vals.push(Number(c));else{out.vals.push(null);bad.push((i+1)+"번째 \""+c+"\"는 숫자 아님");}
    }
  }
  bad.slice(0,3).forEach(function(b){out.errors.push(b);});
  if(bad.length>3)out.errors.push("그 밖에 "+(bad.length-3)+"곳 더 있음");
  out.count=out.vals.length;
  if(out.count>n){out.errors.push(out.count+"개 입력됨. 이 칸은 "+n+"종. "+(out.count-n)+"개 초과");out.vals=out.vals.slice(0,n);}
  else if(out.count>0&&out.count<n&&!bad.length)out.warns.push(out.count+"/"+n+"종 입력됨. 나머지 "+(n-out.count)+"종은 미입력, 기존 유지");
  return out;
}

// ---------- 현재 칸 계산 ----------
function view(){
  var g=group(S.gid);if(!g)return null;
  var p=parseDigits(S.digits,g.items.length);
  var rows=g.items.map(function(it,i){
    var d=p.vals[i];if(d===undefined)d=null;
    var m=S.manual[it.id],hasM=typeof m==="number";
    var c=cnt(it.id,S.loc),prev=c?c.qty:null;
    var val=hasM?m:d;
    return {it:it,prev:prev,val:val,fromDigits:!hasM&&d!=null,manual:hasM,badDigit:!hasM&&d==null&&i<p.count};
  });
  var input=rows.filter(function(r){return r.val!=null;}).length;
  var changed=rows.filter(function(r){return r.val!=null&&r.val!==r.prev;}).length;
  return {g:g,p:p,rows:rows,input:input,changed:changed,blocked:p.errors.length>0||input===0||rows.some(function(r){return r.badDigit;})};
}

// ---------- 초안 ----------
var draftTimer=null;
function saveDraft(){
  clearTimeout(draftTimer);
  draftTimer=setTimeout(function(){
    if(!S.gid||(!S.digits&&!Object.keys(S.manual).length)){lsDel(DRAFT_KEY);return;}
    lsSet(DRAFT_KEY,JSON.stringify({gid:S.gid,loc:S.loc,date:S.date,day:todayKST(),digits:S.digits,manual:S.manual}));
  },200);
}
function loadDraft(){
  try{
    var d=JSON.parse(lsGet(DRAFT_KEY)||"null");
    if(d&&group(d.gid)){S.gid=d.gid;S.loc=LOC_NAME[d.loc]?d.loc:"fridge";if(d.date){if(d.day===todayKST()&&validDate(d.date))S.date=d.date;else if(d.date!==todayKST())S.dateReset=true;}S.digits=String(d.digits||"").slice(0,200);S.manual={};
      Object.keys(d.manual||{}).forEach(function(k){var v=d.manual[k];if(findItem(k)&&Number.isInteger(v)&&v>=0&&v<=99)S.manual[k]=v;});}
  }catch(e){}
}

function renderPreview(){

function rowSub(r){
  var c=cnt(r.it.id,S.loc),pd=c&&c.surveyDate?c.surveyDate:"";
  var parts=[],prevTxt=r.prev==null?"이전 -":"이전 "+r.prev+(pd?" ("+fmtDate(pd)+")":"");
  if(r.val==null)parts.push(h("span",{},prevTxt+" → ",h("span",{class:"keep",text:"미입력, 기존 유지"})));
  else{parts.push(h("span",{},prevTxt+" → ",h("b",{text:String(r.val)})));if(r.manual)parts.push(h("span",{class:"tag",text:"직접 수정"}));}
  if(pd&&r.prev!=null)parts.push(staleTag(pd));
  if(S.loc==="fridge"){var q=r.val!=null?r.val:r.prev;parts.push(badge(q,r.it.min));}
  return parts;
}
function rowClass(r){return "row"+(r.badDigit?" bad":r.val!=null&&r.val!==r.prev?" chg":r.val!=null?" has":"");}
function buildRow(r){
  var it=r.it;
  var inp=h("input",{type:"text",inputmode:"numeric",maxlength:"2","aria-label":it.name+" 수량 직접 입력",value:r.val==null?"":String(r.val),placeholder:"-","data-qty":it.id,autocomplete:"off",
    oninput:function(ev){setManual(it.id,ev.target.value,ev.target);}});
  var minus=h("button",{type:"button","aria-label":it.name+" 수량 1 줄이기","data-minus":it.id,text:"−",disabled:r.val==null||r.val<=0,onclick:function(){bump(it.id,-1);}});
  var plus=h("button",{type:"button","aria-label":it.name+" 수량 1 늘리기","data-plus":it.id,text:"+",disabled:r.val!=null&&r.val>=99,onclick:function(){bump(it.id,1);}});
  return h("div",{class:rowClass(r),"data-id":it.id},
    h("div",{class:"rname"},h("span",{class:"rno",text:it.no+"."}),it.name,it.confirm?h("span",{class:"tag",text:"확인 필요"}):null),
    h("div",{class:"rsub","data-sub":it.id},rowSub(r)),
    h("div",{class:"step"},minus,inp,plus));
}
// 행 하나만 제자리 갱신(포커스·스크롤 유지)
function updateRow(id,keepInput){
  var v=view();if(!v)return;
  var r=v.rows.filter(function(x){return x.it.id===id;})[0],row=document.querySelector('#rows [data-id="'+id+'"]');
  if(!r||!row){renderPreview();return;}
  row.className=rowClass(r);
  var sub=row.querySelector("[data-sub]");sub.replaceChildren.apply(sub,rowSub(r));
  var inp=row.querySelector("[data-qty]");if(!keepInput)inp.value=r.val==null?"":String(r.val);
  row.querySelector("[data-minus]").disabled=r.val==null||r.val<=0;row.querySelector("[data-plus]").disabled=r.val!=null&&r.val>=99;
  $("resetManual").hidden=!Object.keys(S.manual).length;
  updateBar(v);
}
function setManual(id,raw,el){
  var t=normDigits(raw);
  if(t===""){delete S.manual[id];el.removeAttribute("aria-invalid");}
  else if(/^\d{1,2}$/.test(t))S.manual[id]=Number(t);
  else{el.setAttribute("aria-invalid","true");return;}
  el.removeAttribute("aria-invalid");
  updateRow(id,true);saveDraft();
}
function bump(id,d){
  var v=view(),r=v.rows.filter(function(x){return x.it.id===id;})[0];
  var cur=r.val==null?(d>0?0:null):r.val;if(cur==null)return;
  S.manual[id]=Math.max(0,Math.min(99,cur+d));
  updateRow(id,false);saveDraft();
  var b=document.querySelector('#rows [data-id="'+id+'"] [data-'+(d>0?"plus":"minus")+']');if(b&&!b.disabled)b.focus({preventScroll:true});
}
function updateBar(v){
  var bar=$("bar");
  var show=!!v&&!S.query&&S.view==="input"&&S.mode!=="kitchen";
  bar.hidden=!show;
  if(!show)return;
  $("sum").textContent=v.g.name+" · "+LOC_NAME[S.loc]+" · 조사 "+fmtDate(S.date)+" · 입력 "+v.input+"/"+v.g.items.length+"종 · 변경 "+v.changed+"종";
  $("submitBtn").disabled=v.blocked||S.sending;
}

// ---------- 필요 목록 ----------
// 냉장고 수량 기준 필요·없음만. 냉장고 조사 기록이 없는 와인은 미조사로 따로 둔다. 복사 텍스트는 이름·상태·수량·조사일만.
function needData(){
  var groups=[],un=[];
  S.groups.forEach(function(g){
    var rows=[];
    g.items.forEach(function(it){
      var f=cnt(it.id,"fridge"),st=cnt(it.id,"storage");
      if(!f){un.push(it);return;}
      var s=statusOf(f.qty,it.min);
      if(s.cls!=="s-none"&&s.cls!=="s-low")return;
      rows.push({it:it,f:f.qty,s:st?st.qty:null,date:f.surveyDate||"",status:s});
    });
    if(rows.length)groups.push({name:g.name,rows:rows});
  });
  return {groups:groups,un:un};
}
function needText(d){
  var latest="";d.groups.forEach(function(g){g.rows.forEach(function(r){if(r.date>latest)latest=r.date;});});
  var out=["필요 와인"+(latest?" (조사일 "+fmtDate(latest)+")":"")];
  d.groups.forEach(function(g){
    out.push("["+g.name+"]");
    g.rows.forEach(function(r){out.push("- "+r.it.name+" ("+r.status.text.replace(/^\S+\s/,"")+", 냉장고 "+r.f+"·창고 "+(r.s==null?"-":r.s)+(r.date&&r.date!==latest?", 조사 "+fmtDate(r.date):"")+")");});
  });
  return out.join("\n");
}
function copyText(text){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text);
  return new Promise(function(ok,fail){var a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();var done=false;try{done=document.execCommand("copy");}catch(e){}a.remove();done?ok():fail(new Error("copy"));});
}
function renderNeed(){

    var msg=h("div",{id:"needCopyMsg",class:"hint",role:"status"});
    kids.push(h("div",{class:"acts",style:"margin:0 0 8px;align-items:center"},h("b",{id:"needCount",text:"필요·없음 "+total+"종"}),h("button",{type:"button",class:"btn primary",id:"needCopy",text:"목록 복사",onclick:function(){
      copyText(needText(needData())).then(function(){msg.textContent="복사됨. 메신저에 붙여넣기";},function(){msg.textContent="복사 실패. 직접 선택해 복사";});
    }})),msg);
    d.groups.forEach(function(g){
      kids.push(h("div",{class:"sech","data-ngroup":g.name,text:g.name+" "+g.rows.length+"종"}));
      kids.push(h("div",{class:"rows"},g.rows.map(function(r){
        return h("div",{class:"nrow"+(r.status.cls==="s-none"?" none":""),"data-need":r.it.id},
          h("div",{class:"rname",text:r.it.name}),
          h("div",{class:"nsub"},h("span",{class:"badge "+r.status.cls,text:r.status.text}),h("span",{text:"냉장고 "+r.f+" · 창고 "+(r.s==null?"-":r.s)}),h("span",{text:"조사 "+(r.date?fmtDate(r.date):"-")}),r.date?staleTag(r.date):null));
      })));
    });
  }
  if(d.un.length)kids.push(h("details",{class:"un",id:"needUn"},h("summary",{text:"미조사 "+d.un.length+"종 (필요 목록에 넣지 않음)"}),h("ul",{},d.un.map(function(it){return h("li",{text:it.name});}))));
  box.replaceChildren.apply(box,kids);
}

var ADM={token:null,sup:null,err:"",busy:false,over:{}},ADM_KEY="harago-admin-token";
try{ADM.token=sessionStorage.getItem(ADM_KEY);}catch(e){}
function admStore(t){ADM.token=t;try{if(t)sessionStorage.setItem(ADM_KEY,t);else sessionStorage.removeItem(ADM_KEY);}catch(e){}}
function admApi(method,path,body){
  var headers={"content-type":"application/json"};if(ADM.token)headers.authorization="Bearer "+ADM.token;
  return fetch(API_BASE+path,{method:method,headers:headers,body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(d){
      if(r.status===401&&path!=="/api/admin/login"){admStore(null);ADM.sup=null;ADM.err="로그인 만료. 다시 로그인";}
      if(!r.ok){var e=new Error(d.error||("오류 "+r.status));e.status=r.status;throw e;}
      return d;
    });
  },function(){throw new Error("서버 연결 불가. 연결 후 다시 시도");});
}
function admLoadSup(){
  ADM.busy=true;renderOrder();
  admApi("GET","/api/admin/inventory/suppliers").then(function(d){ADM.sup=d.suppliers||{};ADM.err="";},function(e){if(ADM.token)ADM.err=e.message;}).then(function(){ADM.busy=false;renderOrder();});
}
function orderData(){
  var by={},fill=[],un=[];
  S.groups.forEach(function(g){g.items.forEach(function(it){
    var f=cnt(it.id,"fridge"),st=cnt(it.id,"storage");
    if(!f){un.push(it);return;}
    var min=it.min,fq=f.qty,sq=st?st.qty:0;
    if(fq>=min)return;
    if(fq+sq>=min){fill.push({it:it,move:min-fq,f:fq,s:st?sq:null,min:min});return;}
    var key=String(ADM.sup[it.id]||"").trim();
    (by[key]=by[key]||[]).push({it:it,def:Math.max(0,min-fq-sq),f:fq,s:st?sq:null,min:min});
  });});
  var keys=Object.keys(by).filter(Boolean).sort(function(a,b){return a.localeCompare(b,"ko");});
  if(by[""])keys.push("");
  return {groups:keys.map(function(k){return {key:k,rows:by[k]};}),fill:fill,un:un};
}

var KDRAFT_KEY="harago-kit-draft",KPENDING_KEY="harago-kit-pending",MODE_KEY="harago-inv-mode";
var K_STATE={ok:["s-ok","● 충분","충분"],low:["s-low","▲ 부족","부족"],out:["s-none","✕ 없음","없음"]};
var K_LOC_ORDER=["냉장고","냉장고 문","와인 냉장고","냉동실","조리대","싱크대 & 스텐다이","기타","기본안주 아래","창고","조리대 수납함","스텐다이","싱크대"];
var K={items:[],states:null,stockState:"loading",marks:{},sort:"loc",view:"input",sending:false};
function kSetItems(data){
  K.items=(data&&data.items||[]).filter(function(it){return it&&it.id&&it.name;}).map(function(it){return {id:it.id,name:it.name,loc:it.loc||"위치 미정",loc2:it.loc2||"",shop:it.shop||""};});
  var ids={};K.items.forEach(function(it){ids[it.id]=1;});

}
function kItem(id){for(var i=0;i<K.items.length;i++)if(K.items[i].id===id)return K.items[i];return null;}
function kPrev(id){var c=K.states&&K.states[id];return c&&K_STATE[c.state]?c:null;}
function kBadge(st){var s=K_STATE[st];return s?h("span",{class:"badge "+s[0],text:s[1]}):h("span",{class:"badge s-na",text:"- 미조사"});}
function kWhere(it){return it.loc+(it.loc2?"·"+it.loc2:"");}
// 묶음: 위치별(매장 도는 순서) 또는 구입처별(이름순, 미정은 맨 뒤). 묶음 안은 목록 순서.
function kGroups(items){
  var by={},keys=[];
  items.forEach(function(it){var k=K.sort==="shop"?it.shop:it.loc;if(!by[k]){by[k]=[];keys.push(k);}by[k].push(it);});
  if(K.sort==="shop")keys.sort(function(a,b){if(!a)return 1;if(!b)return -1;return a.localeCompare(b,"ko");});
  else keys.sort(function(a,b){var x=K_LOC_ORDER.indexOf(a),y=K_LOC_ORDER.indexOf(b);x=x<0?99:x;y=y<0?99:y;return x-y;});
  return keys.map(function(k){return {key:k,label:k||(K.sort==="shop"?"구입처 미정":"위치 미정"),items:by[k]};});
}
function kCounts(){var n=0,low=0,out=0;Object.keys(K.marks).forEach(function(k){n++;if(K.marks[k]==="low")low++;if(K.marks[k]==="out")out++;});return {n:n,low:low,out:out};}
var kDraftTimer=null;
function kSaveDraft(){
  clearTimeout(kDraftTimer);
  kDraftTimer=setTimeout(function(){if(!Object.keys(K.marks).length){lsDel(KDRAFT_KEY);return;}lsSet(KDRAFT_KEY,JSON.stringify({date:S.date,day:todayKST(),marks:K.marks}));},200);

function kLoadDraft(){

}
function kRowSub(it){

  parts.push(h("span",{},"이전 ",kBadge(c?c.state:null),c?" "+fmtDate(c.surveyDate):""));

}
function kRowClass(it){var m=K.marks[it.id],c=kPrev(it.id);return "krow"+(m?(c&&c.state===m?" has":" chg"):"");}

    h("div",{class:"rname",text:it.name}),
    h("div",{class:"rsub","data-ksub":it.id},kRowSub(it)),

function kMark(id,st){

// 필요 목록: 최신 상태가 부족·없음인 품목. 복사 문구도 지금 정렬(위치별/구입처별) 묶음 그대로.
function kNeedData(){
  var rows=[],un=[];
  K.items.forEach(function(it){var c=kPrev(it.id);if(!c){un.push(it);return;}if(c.state==="low"||c.state==="out")rows.push(it);});

function kNeedText(d){
  var latest="";d.groups.forEach(function(g){g.items.forEach(function(it){var c=kPrev(it.id);if(c.surveyDate>latest)latest=c.surveyDate;});});
  var out=["주방 부족 목록"+(latest?" (조사일 "+fmtDate(latest)+")":"")];
  d.groups.forEach(function(g){
    out.push("["+g.label+"]");
    g.items.forEach(function(it){var c=kPrev(it.id);out.push("- "+it.name+" ("+K_STATE[c.state][2]+(c.surveyDate!==latest?", 조사 "+fmtDate(c.surveyDate):"")+")");});
  });
  return out.join("\n");
}

    kids.push(h("div",{class:"acts",style:"margin:0 0 8px;align-items:center"},h("b",{id:"kNeedCount",text:"부족·없음 "+d.total+"개"}),h("button",{type:"button",class:"btn primary",id:"kCopy",text:"목록 복사",onclick:function(){
      copyText(kNeedText(kNeedData())).then(function(){msg.textContent="복사됨. 메신저에 붙여넣기";},function(){msg.textContent="복사 실패. 직접 선택해 복사";});
    }})),msg);
    d.groups.forEach(function(g){
      kids.push(h("div",{class:"sech","data-kngroup":g.label,text:g.label+" "+g.items.length+"개"}));
      kids.push(h("div",{class:"rows"},g.items.map(function(it){var c=kPrev(it.id);
        return h("div",{class:"nrow"+(c.state==="out"?" none":""),"data-kneed":it.id},h("div",{class:"rname",text:it.name}),
          h("div",{class:"nsub"},kBadge(c.state),h("span",{text:K.sort==="shop"?kWhere(it):(it.shop||"구입처 미정")}),h("span",{text:"조사 "+fmtDate(c.surveyDate)}),staleTag(c.surveyDate)));
      })));

  if(d.un.length)kids.push(h("details",{class:"un",id:"kNeedUn"},h("summary",{text:"미조사 "+d.un.length+"개 (필요 목록에 넣지 않음)"}),h("ul",{},d.un.map(function(it){return h("li",{text:it.name});}))));

// 제출
function kSig(b){return JSON.stringify([b.surveyDate,b.entries.map(function(e){return [e.itemId,e.state];})]);}

    h("ul",{id:"kDlgSum"},h("li",{id:"kDlgDate",text:"조사 일자: "+S.date+(S.date===todayKST()?" (오늘)":" (오늘 아님)")}),h("li",{text:"입력 "+c.n+"/"+K.items.length+"개 · 충분 "+(c.n-c.low-c.out)+" · 부족 "+c.low+" · 없음 "+c.out})),
    bad.length?h("ul",{class:"keep",id:"kDlgLines"},bad.map(function(e){return h("li",{text:e.name+": "+K_STATE[e.state][2]});})):null,
    h("p",{class:"hint",text:"누르지 않은 품목은 기존 상태 유지. 더 늦은 조사 일자의 상태는 덮어쓰지 않음."}),

function kSend(body){
  var p=kReadPending(),sig=kSig(body);
  body.surveyId=p&&p.sig===sig?p.id:uuid();
  lsSet(KPENDING_KEY,JSON.stringify({id:body.surveyId,sig:sig,body:body,at:Date.now(),n:body.entries.length}));
  kPost(body);
}
function kPost(body){
  K.sending=true;kUpdateBar();
  dlg.replaceChildren(h("h2",{id:"dlgTitle",text:"제출 중"}),h("div",{class:"msg",role:"status",text:"제출 중. 창을 닫지 말고 잠시 기다림"}));openDlg();
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort();},15000);
  var done=function(){K.sending=false;kUpdateBar();};
  fetch(API_BASE+"/api/inventory/kitchen/survey",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body),signal:ctl.signal,cache:"no-store"}).then(function(r){
    clearTimeout(to);return r.json().catch(function(){return {};}).then(function(d){return {status:r.status,d:d};});
  }).then(function(res){
    done();var st=res.status,d=res.d||{};
    if((st===201||st===200)&&d.saved===true){kSaved(body,!!d.alreadySaved);return;}
    if(st===400){lsDel(KPENDING_KEY);kRenderPending();showResult("err","제출 불가",[d.error||"입력 내용 확인 필요"].concat((d.details||[]).slice(0,3).map(function(x){return x.reason;})));return;}
    if(st===409){lsDel(KPENDING_KEY);kRenderPending();showResult("err","제출 안 됨",[d.error||"주방 목록이 바뀜. 새로고침 후 다시 입력"],{reload:true});return;}
    if(st===429){lsDel(KPENDING_KEY);kRenderPending();showResult("warn","제출 횟수 초과",[d.error||"잠시 후 다시 제출","입력은 보존됨"]);return;}
    kUncertain(d.error);
  },function(){done();clearTimeout(to);kUncertain();});
}
function kUncertain(msg){
  showResult("warn","저장 여부 확인 안 됨",[msg||"연결이 불안정함. 저장됐는지 확인하지 못함","같은 내용으로 다시 제출하면 중복 저장되지 않음","입력은 이 기기에 보존됨"],{retry:true,onRetry:kRetry});
  kRenderPending();
}
function kRetry(){var p=kReadPending();if(!p){closeDlg();return;}if(navigator.onLine===false){showResult("warn","오프라인",["연결 후 다시 시도"],{retry:true,onRetry:kRetry});return;}kPost(p.body);}
function kSaved(body,already){
  lsDel(KPENDING_KEY);lsDel(KDRAFT_KEY);

  K.marks={};kRender();
  var low=body.entries.filter(function(e){return e.state!=="ok";}).length;
  showResult("ok","제출 완료",["주방 "+body.entries.length+"개 저장"+(already?" (이미 저장돼 있었음)":""),"부족·없음 "+low+"개는 '필요 목록'에서 복사","조사 일자 "+body.surveyDate,"입력 초기화됨"]);
}

window.addEventListener("online",function(){showNet(false);});
window.addEventListener("offline",function(){showNet(true);});
window.addEventListener("beforeunload",function(){clearTimeout(draftTimer);clearTimeout(kDraftTimer);if(Object.keys(K.marks).length)lsSet(KDRAFT_KEY,JSON.stringify({date:S.date,day:todayKST(),marks:K.marks}));if(S.gid&&(S.digits||Object.keys(S.manual).length))lsSet(DRAFT_KEY,JSON.stringify({gid:S.gid,loc:S.loc,date:S.date,day:todayKST(),digits:S.digits,manual:S.manual}));});
(function init(){
  setGroups(EMBEDDED);kSetItems(EMBEDDED_KITCHEN);
  S.date=todayKST();S.dayAt=S.dayPrev=S.date;
  loadDraft();kLoadDraft();
  K.sort=lsGet("harago-kit-sort")==="shop"?"shop":"loc";
  applyDateUi();if(S.dateReset)setDateNote("날짜를 오늘로 맞춤");
  $("digits").value=S.digits;
  renderChips();renderPanel();renderPendingBox();
  setMode(location.hash==="#kitchen"?"kitchen":lsGet(MODE_KEY)==="kitchen"?"kitchen":"wine");
  if(navigator.onLine===false)showNet(true);
  loadStock().then(function(){
    renderChips();renderNeed();if(S.view==="order")renderOrder();
    var a=document.activeElement;
    if(a&&a.closest&&a.closest("#rows")){var v=view();if(v)v.rows.forEach(function(r){updateRow(r.it.id,true);});}else renderPanel();
    if(S.query&&!S.detail)renderSearch();
  });
  // 주방 상태는 와인 수량 다음에 요청한다(와인 화면 동작·요청 순서는 그대로).
  kLoad().then(function(){if(S.mode==="kitchen"){var a=document.activeElement;if(a&&a.closest&&a.closest("#kRows")){kRenderMsg();}else kRender();}});
})();
</script></body></html>
